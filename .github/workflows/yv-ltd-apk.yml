name: Build YV LTD APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'yvapp/**'
      - 'settings.gradle'
      - '.github/workflows/yv-ltd-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Y.V L.T.D. debug APK
        run: gradle --no-daemon :yvapp:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YV-LTD-APK
          path: yvapp/build/outputs/apk/debug/yvapp-debug.apk
          if-no-files-found: error
