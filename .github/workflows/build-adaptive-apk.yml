name: Build Smart Brightness APK

on:
  push:
    paths:
      - 'adaptive/**'
      - 'settings.gradle'
      - '.github/workflows/build-adaptive-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build separate app
        run: gradle --no-daemon :adaptive:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-brightness-apk
          path: adaptive/build/outputs/apk/debug/adaptive-debug.apk
          if-no-files-found: error
