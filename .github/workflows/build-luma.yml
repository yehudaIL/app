name: Build Luma APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'wallpapers/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build-luma.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :wallpapers:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luma-wallpapers-APK
          path: wallpapers/build/outputs/apk/debug/wallpapers-debug.apk
          if-no-files-found: error
          retention-days: 14
