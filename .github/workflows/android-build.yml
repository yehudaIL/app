name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build live wallpaper APK
        run: gradle --no-daemon :wallpapers:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luma-wallpapers-APK
          path: wallpapers/build/outputs/apk/debug/wallpapers-debug.apk
          if-no-files-found: error
          retention-days: 14
