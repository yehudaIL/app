name: Stealth Vault APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vault/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/stealth-vault-apk.yml'

permissions:
  contents: read

jobs:
  build-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Stealth Vault APK
        run: gradle --no-daemon :vault:assembleDebug
      - name: Upload Stealth Vault APK
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-Vault-APK
          path: vault/build/outputs/apk/debug/vault-debug.apk
          if-no-files-found: error
          retention-days: 14
